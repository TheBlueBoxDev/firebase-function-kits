version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
